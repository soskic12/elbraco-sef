[project]
name = "elbraco-sef"
version = "0.1.0"
description = "Preuzimanje, razvrstavanje i obrada ulaznih e-faktura sa SEF-a (Sistem elektronskih faktura RS)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.2",
    "SQLAlchemy>=2.0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "tenacity>=8.3",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
mssql = ["pyodbc>=5.1"]
# pyodbc je potreban i za prijavu (provera naloga na SQL serveru)
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
sefsync = "sefsync.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sefsync = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
