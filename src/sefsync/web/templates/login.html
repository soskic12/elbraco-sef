<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prijava — ELBRACO e-fakture</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: #eef1f5; color: #1d2330;
           font: 14px/1.45 "Segoe UI", Roboto, Arial, sans-serif; }
    .kutija { background: #fff; border: 1px solid #e2e5ea; border-radius: 10px;
              padding: 28px 30px; width: 360px; box-shadow: 0 2px 14px rgba(0,0,0,.06); }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.uvod { color: #6b7280; margin: 0 0 18px; font-size: 13px; }
    label { display: block; font-size: 12px; color: #6b7280; margin: 12px 0 3px; }
    input { width: 100%; padding: 9px 10px; border: 1px solid #c8cdd6; border-radius: 5px;
            font: inherit; box-sizing: border-box; }
    button { margin-top: 18px; width: 100%; padding: 10px; border: 0; border-radius: 5px;
             background: #0b5cad; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .greska { margin-top: 14px; padding: 9px 11px; border-radius: 6px; background: #fdeceb;
              border: 1px solid #f6c9c5; color: #b42318; font-size: 13px; }
    .nota { margin-top: 16px; color: #6b7280; font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <form class="kutija" method="post" action="/prijava">
    <h1>ELBRACO · e-fakture</h1>
    <p class="uvod">Prijava istim nalogom kojim ulaziš u ERP.</p>

    <label for="korisnik">Korisničko ime</label>
    <input id="korisnik" name="korisnik" autocomplete="username" autofocus required>

    <label for="lozinka">Lozinka</label>
    <input id="lozinka" name="lozinka" type="password" autocomplete="current-password" required>

    <button type="submit">Prijavi se</button>

    {% if greska %}<div class="greska">{{ greska }}</div>{% endif %}

    <p class="nota">Lozinka se nigde ne čuva — proverava je server. Ko šta vidi zavisi od
      funkcije i objekta upisanih u šifarniku osoblja.</p>
  </form>
</body>
</html>
